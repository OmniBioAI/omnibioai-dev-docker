[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibioai-dev-docker"
version = "1.0.0"
description = "Full AI/bioinformatics development environment — CUDA + PyTorch + R + GATK + Nextflow + Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Manish Kumar" }
]
keywords = [
    "bioinformatics",
    "docker",
    "pytorch",
    "cuda",
    "gpu",
    "genomics",
    "nextflow",
    "gatk",
    "ollama",
    "jupyterlab",
    "omnibioai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/OmniBioAI/omnibioai"
Repository = "https://github.com/OmniBioAI/omnibioai-dev-docker"
"Docker Image" = "https://ghcr.io/omnibioai/omnibioai-dev-env"
"Bug Tracker" = "https://github.com/OmniBioAI/omnibioai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:django -v --tb=short"
markers = [
    "gpu: marks tests that require GPU (deselect with '-m not gpu')",
    "slow: marks tests that are slow to run",
]

[tool.coverage.run]
branch = true
source = ["tests"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "setup.py",
]

[tool.coverage.report]
show_missing = true
# fail_under not set — this repo has no application source code to measure
# coverage is 100% by definition when all 117 tests pass
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
